name: Set up protofetch
description: Installs the protofetch version in .tool-versions, cached, and fetches over HTTPS.

runs:
  using: composite
  steps:
    - name: Get protofetch version
      id: version
      shell: bash
      run: echo "version=$(awk '$1 == "protofetch" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

    - name: Cache protofetch
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/protofetch
        key: ${{ runner.os }}-protofetch-${{ steps.version.outputs.version }}

    - name: Install protofetch
      shell: bash
      run: ./script/install-protofetch.sh

    # The runner has no SSH key, which protofetch fetches with by default.
    - name: Fetch over HTTPS
      shell: bash
      run: echo "PROTOFETCH_GIT_PROTOCOL=https" >> "$GITHUB_ENV"
