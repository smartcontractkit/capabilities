name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  # Ensure that a cached go version is used:
  # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#go
  GO_VERSION: 1.27.3
  GOPRIVATE: github.com/smartcontractkit/capabilities

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      nx: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # There's no need to setup Node as it is pre-installed:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
      - name: Cache NX
        uses: actions/cache@v4
        with:
          path: |
            .nx
            ~/.npm
          key: ${{ runner.os }}-nx
        # Outputs:
        # {
        #   "base": "main",
        #   "projects": [
        #     "project_name_1",
        #     "project_name_2",
        #   ],
        #   "project_name_1": {
        #     "root": "project_1_root",
        #     "go_sum": "project_1_root/go.sum"
        #   },
        #   "project_name_2": {
        #     "root": "project_2_root",
        #     "go_sum": "project_2_root/go.sum"
        #   }
        #   "run_checks": true
        # }

      - name: Setup nodejs and install nx
        uses: smartcontractkit/.github/actions/setup-nodejs@setup-nodejs/v1

      - name: Get affected projects
        id: affected
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            BASE="origin/main~1"
          else
            BASE="origin/main"
          fi
          echo "affected=$(./.github/scripts/affected-projects.sh $BASE)" >> $GITHUB_OUTPUT

  build:
    needs: affected
    if: ${{fromJson(needs.affected.outputs.nx).projects_with_build != null && contains(fromJson(needs.affected.outputs.nx).projects_with_build, fromJson(needs.affected.outputs.nx).projects_with_build[0])}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        projects: ${{fromJson(needs.affected.outputs.nx).projects_with_build}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project environment
        uses: ./.github/actions/setup
        with:
          project: ${{ matrix.projects }}
          go-module-file: ${{ fromJson(needs.affected.outputs.nx)[matrix.projects].go_sum }}
          task: "build"

      - name: Support private Go modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/support-private-gomods.sh

      - name: Build ${{ matrix.projects }}
        run: ./.github/scripts/nx-run-if-exists.sh ${{ matrix.projects }} build

  test:
    needs: affected
    if: ${{fromJson(needs.affected.outputs.nx).projects_with_test != null && contains(fromJson(needs.affected.outputs.nx).projects_with_test, fromJson(needs.affected.outputs.nx).projects_with_test[0])}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{fromJson(needs.affected.outputs.nx).projects_with_test}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project environment
        uses: ./.github/actions/setup
        with:
          project: ${{ matrix.projects }}
          go-module-file: ${{ fromJson(needs.affected.outputs.nx)[matrix.projects].go_sum }}
          task: "test"

      - name: Support private Go modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/support-private-gomods.sh

      - name: Install Solana CLI
        if: matrix.projects == 'solana'
        run: ./.github/scripts/install-solana-ci.sh

      - name: Setup Test DB
        if: matrix.projects == 'solana'
        id: setup-testdb
        uses: ./.github/actions/setup-testdb

      - name: Unit Test solana
        if: matrix.projects == 'solana'
        run: ./nx run solana:test
        env:
          CL_DATABASE_URL: ${{ steps.setup-testdb.outputs.cl-db-url }}

      - name: Unit Test ${{ matrix.projects }}
        if: matrix.projects != 'solana'
        run: ./nx run ${{ matrix.projects }}:test

      - name: Upload Unit Tests Artifacts
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          # name artifacts differently per each report
          name: ${{ matrix.projects }}_go_test_results
          # the path to a generated report (per directory)
          path: |
            ./${{fromJson(needs.affected.outputs.nx)[matrix.projects].root}}/coverage.txt

  race:
    needs: affected
    if: ${{fromJson(needs.affected.outputs.nx).projects_with_race != null && contains(fromJson(needs.affected.outputs.nx).projects_with_race, fromJson(needs.affected.outputs.nx).projects_with_race[0])}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projects: ${{fromJson(needs.affected.outputs.nx).projects_with_race}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project environment
        uses: ./.github/actions/setup
        with:
          project: ${{ matrix.projects }}
          go-module-file: ${{ fromJson(needs.affected.outputs.nx)[matrix.projects].go_sum }}
          task: "race"

      - name: Support private Go modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/support-private-gomods.sh

      - name: Install Solana CLI
        if: matrix.projects == 'solana'
        run: ./.github/scripts/install-solana-ci.sh

      - name: Setup Test DB
        if: matrix.projects == 'solana'
        id: setup-testdb
        uses: ./.github/actions/setup-testdb

      - name: Race Test solana
        if: matrix.projects == 'solana'
        run: ./nx run solana:race
        env:
          CL_DATABASE_URL: ${{ steps.setup-testdb.outputs.cl-db-url }}

      - name: Race Test ${{ matrix.projects }}
        if: matrix.projects != 'solana'
        run: ./nx run ${{ matrix.projects }}:race


  integration-tests:
    uses: ./.github/workflows/integration-tests.yml

  lint:
    needs: affected
    if: ${{fromJson(needs.affected.outputs.nx).run_checks}}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        projects: ${{fromJson(needs.affected.outputs.nx).projects}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project environment
        id: setup
        uses: ./.github/actions/setup
        with:
          project: ${{ matrix.projects }}
          go-module-file: ${{ fromJson(needs.affected.outputs.nx)[matrix.projects].go_sum }}
          task: "lint"

      - name: Support private Go modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/support-private-gomods.sh

      - name: Get golangci-lint version from asdf
        id: get-version
        run: |
          version=$(grep '^golangci-lint ' .tool-versions | awk '{print $2}')
          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"

      - name: golangci-lint (${{ matrix.projects }})
        uses: smartcontractkit/.github/actions/ci-lint-go@ci-lint-go/4.2.1
        with:
          checkout-repo: false
          golangci-lint-config: ${{ github.workspace }}/.golangci.yml
          golangci-lint-version: v${{ steps.get-version.outputs.version }}
          go-directory: ${{fromJson(needs.affected.outputs.nx)[matrix.projects].root}}

  # Formats the protos and Go, regenerates and tidies every module, and commits the result to the pull request. On
  # main and in the merge queue it can't commit, so it fails when anything is out of date instead.
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Commits pushed with GITHUB_TOKEN don't trigger CI, so the commit is pushed with a GATI token, and the job fails
      # without one. Forks get no secrets, and nothing is committed outside pull requests, so neither needs one.
      - name: Get GitHub token
        id: token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/v1
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN_GATI_CHANGESETS }}
          aws-lambda-url: ${{ secrets.AWS_LAMBDA_URL_GATI }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up project environment
        uses: ./.github/actions/setup
        with:
          project: all
          go-module-file: "**/go.sum"
          task: autofix

      - name: Support private Go modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/support-private-gomods.sh

      - name: Install tools
        run: make mockery buf

      # TODO: switch to autofix/v1 once released.
      - name: Autofix
        uses: smartcontractkit/.github/actions/autofix@ccb256da32bde41565d5e0ed953e7eb390395aba # rtinianov_doAndCommit
        env:
          # The runner has no SSH key, which protofetch fetches with by default.
          PROTOFETCH_GIT_PROTOCOL: https
        with:
          github-token: ${{ steps.token.outputs.access-token }}
          commit-message: "chore: format, generate, and tidy"
          # Protos are formatted before anything generates from them. The Go fixers then format Go, generate from the
          # formatted sources, and tidy. go.md graphs the tidied modules, so it's made last.
          setup: ./script/format-protos.sh
          go: true
          run: make modgraph

      # The setup action's cache is only saved when the job succeeds. Save it when it fails too, so a rerun doesn't
      # start cold. The paths and key match the setup action's, which the cache needs to restore it.
      - name: Go cache paths
        id: go-cache
        if: failure()
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" | tee -a "$GITHUB_OUTPUT"
          echo "gobuildcache=$(go env GOCACHE)" | tee -a "$GITHUB_OUTPUT"

      - name: Save Go cache
        if: failure() && steps.go-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.gomodcache }}
            ${{ steps.go-cache.outputs.gobuildcache }}
          key: ${{ runner.os }}-2-all-autofix-gomod-${{ hashFiles('**/go.sum') }}

  checks:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - test
      - race
      - autofix
      - integration-tests
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Some tests failed or were cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
