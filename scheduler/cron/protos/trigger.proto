syntax = "proto3";

// The development package: its production protos are released as capabilities.scheduler.cron.v1, which never
// changes.
package capabilities.scheduler.cron.x.v1;

import "capability/feature/feature.proto";
import "google/protobuf/timestamp.proto";
import "tools/generator/v1alpha/cre_metadata.proto";

option (cre.feature.v1.released) = "psb_migration";

message Config {
  string schedule = 1 [(cre.feature.v1.field) = "psb_migration"]; // Cron schedule string
}

message Payload {
  google.protobuf.Timestamp scheduled_execution_time = 1 [(cre.feature.v1.field) = "psb_migration"];
}

// LegacyPayload is what the retired LegacyTrigger sent, kept as it was released.
message LegacyPayload {
  option deprecated = true;
  string scheduled_execution_time = 1 [(cre.feature.v1.field) = "psb_migration"]; // Time that cron trigger's task execution had been scheduled to occur (RFC3339Nano formatted)
}

service Cron {
  option (tools.generator.v1alpha.capability) = {
    mode: MODE_DON
    capability_id: "cron-trigger@1.0.0"
  };

  rpc Trigger(Config) returns (stream Payload) {
    option (cre.feature.v1.method) = "psb_migration";
  }
}
