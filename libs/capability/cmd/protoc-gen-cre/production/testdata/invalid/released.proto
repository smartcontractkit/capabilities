syntax = "proto3";

package capabilities.test.released.v1;

import "capability/feature/feature.proto";

// The package has no x before its version, so it is not a development package.
message Request {
  string id = 1 [(cre.feature.v1.field) = "launch"];
}

service Released {
  option (cre.feature.v1.released) = "launch";

  rpc Get(Request) returns (Request) {
    option (cre.feature.v1.method) = "launch";
  }
}
