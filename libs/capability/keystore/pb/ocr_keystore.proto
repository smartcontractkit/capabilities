syntax = "proto3";

package capabilities.keystore.pb;

option go_package = "github.com/smartcontractkit/capabilities/libs/capability/keystore/pb";

// OCRKeystore lends a process the node's OCR2 key bundles. Private keys never leave the node.
service OCRKeystore {
  rpc ListKeyBundles(ListKeyBundlesRequest) returns (ListKeyBundlesReply);
  rpc GetKeyBundle(GetKeyBundleRequest) returns (GetKeyBundleReply);

  // Onchain key of a bundle: ocrtypes.OnchainKeyring.
  rpc SignOnchain(SignOnchainRequest) returns (SignOnchainReply);
  // Verification runs on the node too, so the client carries no per-chain verification code.
  rpc VerifyOnchain(VerifyOnchainRequest) returns (VerifyOnchainReply);

  // Offchain key of a bundle: ocrtypes.OffchainKeyring.
  rpc SignOffchain(SignOffchainRequest) returns (SignOffchainReply);
  rpc ConfigDiffieHellman(ConfigDiffieHellmanRequest) returns (ConfigDiffieHellmanReply);
}

message KeyBundle {
  string id = 1;
  // chain_type is the bundle's corekeys.ChainType, e.g. "evm".
  string chain_type = 2;
  // onchain_public_key is the bundle's own key, not multichain-encoded.
  bytes onchain_public_key = 3;
  uint32 onchain_max_signature_length = 4;
  // offchain_public_key is a 32-byte ed25519 key.
  bytes offchain_public_key = 5;
  // config_encryption_public_key is a 32-byte x25519 key.
  bytes config_encryption_public_key = 6;
}

message ListKeyBundlesRequest {
  // chain_types filters the bundles by chain type. Empty lists every bundle.
  repeated string chain_types = 1;
}

message ListKeyBundlesReply {
  repeated KeyBundle key_bundles = 1;
}

message GetKeyBundleRequest {
  string id = 1;
}

message GetKeyBundleReply {
  KeyBundle key_bundle = 1;
}

// ReportContext is libocr's ocrtypes.ReportContext.
message ReportContext {
  // config_digest is 32 bytes.
  bytes config_digest = 1;
  uint32 epoch = 2;
  // round is a uint8 in libocr.
  uint32 round = 3;
  // extra_hash is 32 bytes.
  bytes extra_hash = 4;
}

message SignOnchainRequest {
  string key_bundle_id = 1;
  ReportContext report_context = 2;
  bytes report = 3;
}

message SignOnchainReply {
  bytes signature = 1;
}

message VerifyOnchainRequest {
  string key_bundle_id = 1;
  // public_key is the signer's key for the bundle's chain type, not multichain-encoded.
  bytes public_key = 2;
  ReportContext report_context = 3;
  bytes report = 4;
  bytes signature = 5;
}

message VerifyOnchainReply {
  bool valid = 1;
}

message SignOffchainRequest {
  string key_bundle_id = 1;
  bytes message = 2;
}

message SignOffchainReply {
  bytes signature = 1;
}

message ConfigDiffieHellmanRequest {
  string key_bundle_id = 1;
  // point is 32 bytes.
  bytes point = 2;
}

message ConfigDiffieHellmanReply {
  // shared_secret is 32 bytes.
  bytes shared_secret = 1;
}
