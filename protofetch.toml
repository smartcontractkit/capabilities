name = "capabilities"
description = "Protos the capabilities in this repo import, shared by every module, and by what fetches their production protos"
proto_out_dir = ".deps"

[chainlink-protos]
url = "github.com/smartcontractkit/chainlink-protos"
revision = "aa8c64acc53c074f5fef93a901d1b06fd321922a"
content_roots = ["/cre"]
# Capabilities' protos are their own, not chainlink-protos' copies, which are at the same paths.
deny_policies = ["/capabilities/*"]
